# ══════════════════════════════════════════════════════════════
#  TeslaMate Supercharger Cost Importer — Docker Compose
#
#  Runs the web UI at http://<server>:4002/supercharger and imports
#  the Supercharger costs every night (time set in the web UI).
#
#  HOW TO USE:
#  1. Copy .env.example → .env and fill in your values
#  2. docker compose up -d --build
#  3. Open http://<server>:4002/supercharger → "Tesla account" and
#     follow the one-time setup
# ══════════════════════════════════════════════════════════════

services:

  importer:
    build: .
    container_name: teslamate-suc-importer
    restart: unless-stopped

    env_file: .env

    ports:
      # Behind a reverse proxy you can drop this and route /supercharger
      # to the container instead (see README).
      - "${SUC_PORT:-4002}:4002"

    volumes:
      - ./data:/data    # Tesla token, web settings, keys, last run report
      - ./logs:/logs    # Log files

    networks:
      - teslamate       # Must share the network with TeslaMate's database

# ── Network ────────────────────────────────────────────────────
# Attach to the same network as your TeslaMate stack so the container can
# reach the `database` service by hostname. For a TeslaMate stack in a
# folder called "teslamate" the network is "teslamate_default".
# Override with TESLAMATE_NETWORK in .env (see `docker network ls`).
networks:
  teslamate:
    external: true
    name: ${TESLAMATE_NETWORK:-teslamate_default}
